[project]
name = "bharat-market-intelligence"
version = "1.0.0"
description = "Research-grade Indian market intelligence, regime discovery, prediction and anomaly analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "hmmlearn>=0.3,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "shap>=0.46,<1",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1",
  "vaderSentiment>=3.3,<4",
  "xgboost>=2.1,<4",
  "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
finbert = ["torch>=2.2,<3", "transformers>=4.46,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # FastAPI dependency injection intentionally uses call defaults.
