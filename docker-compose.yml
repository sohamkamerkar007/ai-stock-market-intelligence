services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_intelligence
      POSTGRES_USER: market
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - market_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data

volumes:
  market_db:

